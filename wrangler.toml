name = "jazz-life-tracker"
main = "./worker/index.ts"
compatibility_date = "2025-08-23"
compatibility_flags = ["nodejs_compat"]

# Workers Assets:生产环境由 ASSETS binding 提供 dist/client/ 静态资源。
# 注意:不要指向 ./dist——那会把 vite-plugin 的 worker 产物(含 .dev.vars 拷贝)也当静态资源上传。
[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "jazz-life-tracker"
database_id = "c94fecb8-a703-46bb-9a7e-fcdc7367b80a"

# ---- 环境映射(发布规范适配,2026-09-04)----
# 生产 = 顶层默认 env(worker 名 jazz-life-tracker,保持现有自定义域名/rollback 语义),命令即 `wrangler deploy`。
# ⚠️ 禁止新增 [env.production]:wrangler env 会派生第二个 worker(名 jazz-life-tracker-production),
#    脱离现有域名与数据,等于另起炉灶。
# 预览 = [env.preview],独立 D1,只用于上线前冒烟/迁移先验,不碰生产数据。

[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "jazz-life-tracker-preview"
database_id = "3de8a0a5-49a3-455b-b7dc-632d9774a127"
